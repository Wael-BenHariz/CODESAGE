[pytest]
testpaths = tests
# Make `app` importable when pytest is invoked as a bare entry point (CI runs
# `pytest tests/`, not `python -m pytest`) — no sys.path bootstrap in conftest.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
markers =
    integration: tests requiring the disposable database, Redis, or real Keycloak
    e2e: end-to-end tests requiring external services
    live: tests that contact live analysis services
