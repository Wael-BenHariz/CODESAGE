# Mypy configuration for the CodeSage backend.
#
# CI runs plain `mypy .` from backend/, so this file is picked up
# automatically.
#
# - `pydantic.mypy`: without the plugin, mypy treats every non-`...`
#   Pydantic field as a required `__init__` argument (dataclass-transform
#   synthesis) and reports false "Missing named argument" errors for
#   `Settings()`, `RepositoryDetail(...)`, `NormalizedFinding(**base)`, ...
# - `bullmq` ships no type stubs and no py.typed marker.

[mypy]
plugins = pydantic.mypy

[mypy-bullmq.*]
ignore_missing_imports = True
