spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/auth/realms/codesage-realm/protocol/openid-connect/certs

internal:
  security:
    token: test-token

keycloak:
  allowed-issuers: http://keycloak.test/auth/realms/codesage-realm

cors:
  allowed-origins: http://localhost:4200

# Empty by default: quota resolution short-circuits to the defaults below.
# QuotaClientTest points it at a stub/unreachable URL to prove both paths.
services:
  quota:
    url: ""

defaults:
  max-cpu-per-function: 500m
  max-memory-per-function: 512Mi
  max-total-cpu: "10"
  max-total-memory: 20Gi
  max-functions: 10
  max-pods: 50

app:
  cache:
    ttl:
      repo-quota-seconds: 600
      active-repo-namespaces-seconds: 300
      default-seconds: 300
