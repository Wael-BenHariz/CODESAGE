apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: codesage

resources:
  - namespace.yaml
  - postgres
  - redis
  - backend
  - frontend
  - ingress
  # metallb is intentionally NOT listed: it lives in metallb-system and is
  # applied separately per APPLY_ORDER.md Step 1 (`kubectl apply -k .../metallb/`).
  # Including it here would force it into the codesage namespace above and be
  # rejected by the MetalLB admission webhooks.
  - keycloak
