# TEMPLATE — safe to commit.
#
#   cp keycloak-secret.example.yaml keycloak-secret.yaml   # gitignored
#
# Replace every placeholder. These values feed ${env.*} substitutions in the
# realm import JSON (keycloak-configmap.yaml) via the Deployment env.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: codesage
type: Opaque
stringData:
  # Emergency local admin console account (console-only, not an app user).
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: "replace-me-admin-password"
  # Secret of the confidential `codesage-backend` client in the realm import —
  # must match KEYCLOAK_CLIENT_SECRET in backend/secret.yaml.
  KEYCLOAK_CLIENT_SECRET: "replace-me-backend-client-secret"
  # The GitHub OAuth App credentials (same pair as backend/secret.yaml) — the
  # callback URL on github.com must be the Keycloak broker endpoint:
  #   http://<INGRESS_IP>/auth/realms/codesage-realm/broker/github/endpoint
  GITHUB_CLIENT_ID: "your-github-oauth-app-client-id"
  GITHUB_CLIENT_SECRET: "your-github-oauth-app-client-secret"
