# TEMPLATE — safe to commit.
#
#   cp secret.example.yaml secret.yaml    # secret.yaml is gitignored (real creds)
#
# INTERNAL_SERVICE_TOKEN MUST equal REPO_TENANT_INTERNAL_TOKEN in
# infrastructure/k8s/base/backend/secret.yaml — it authenticates the
# backend's calls to /api/v1/repos/internal/** (X-Service-Token header).
apiVersion: v1
kind: Secret
metadata:
  name: repo-tenant-service-secret
  namespace: codesage
type: Opaque
stringData:
  INTERNAL_SERVICE_TOKEN: "your-repo-tenant-internal-token-hex"
  DB_PASSWORD: "codesage"
  REDIS_PASSWORD: "redis_password"
