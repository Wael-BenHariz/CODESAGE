# TEMPLATE — safe to commit.
#
#   cp secret.example.yaml secret.yaml    # secret.yaml is gitignored (real creds)
#
# Replace every "your-..." placeholder and every METALLB_IP with real values.
# Non-secret values (DB/Redis/SonarQube in-cluster URLs, model names) can stay.
apiVersion: v1
kind: Secret
metadata:
  name: codesage-backend-secret
  namespace: codesage
type: Opaque
stringData:
  SECRET_KEY: "your-secret-key-openssl-rand-base64-48"
  DATABASE_URL: "postgresql+asyncpg://codesage:codesage@postgres-service.codesage.svc.cluster.local:5432/codesage"
  REDIS_URL: "redis://:redis_password@redis-service.codesage.svc.cluster.local:6379/0"
  GITHUB_CLIENT_ID: "your-github-oauth-app-client-id"
  GITHUB_CLIENT_SECRET: "your-github-oauth-app-client-secret"
  GITHUB_APP_ID: "your-github-app-id"
  GITHUB_APP_SLUG: "your-github-app-slug"
  GITHUB_APP_PRIVATE_KEY: |-
    -----BEGIN RSA PRIVATE KEY-----
    paste-the-contents-of-your-github-app-private-key-pem-here
    -----END RSA PRIVATE KEY-----
  GITHUB_WEBHOOK_SECRET: "your-github-webhook-secret"
  # NOTE: the GitHub OAuth App callback URL on github.com must now point at
  # Keycloak's broker endpoint (manual step), not this backend:
  #   http://METALLB_IP/auth/realms/codesage-realm/broker/github/endpoint
  GITHUB_CALLBACK_URL: "http://METALLB_IP/auth/realms/codesage-realm/broker/github/endpoint"
  STATE_TOKEN_SECRET: "your-state-token-secret-openssl-rand-hex-32"
  # Keycloak (identity + token authority). In-cluster URL — the browser uses
  # http://METALLB_IP/auth via GET /api/v1/auth/keycloak/config instead.
  KEYCLOAK_URL: "http://keycloak-service.codesage.svc.cluster.local:8080/auth"
  KEYCLOAK_PUBLIC_URL: "http://METALLB_IP/auth"
  KEYCLOAK_REALM: "codesage-realm"
  KEYCLOAK_CLIENT_ID: "codesage-backend"
  KEYCLOAK_CLIENT_SECRET: "your-keycloak-backend-client-secret"
  KEYCLOAK_AUDIENCE: "codesage-angular"
  # Issuer allow-list (JSON array — must be a JSON array, see CORS_ORIGINS).
  # Every entry must end with /realms/codesage-realm; startup rejects anything
  # else. Empty "[]" = accept only the issuer derived from KEYCLOAK_PUBLIC_URL
  # (default, unchanged behavior).
  # IP migration (e.g. MetalLB .201 -> .202): add the NEW issuer BEFORE
  # cutover so both validate, repoint KEYCLOAK_PUBLIC_URL, then remove the
  # old entry once live sessions have rotated (access tokens live ~300 s).
  KEYCLOAK_ALLOWED_ISSUERS: "[\"http://METALLB_IP/auth/realms/codesage-realm\"]"
  GROQ_API_KEY: "your-groq-api-key"
  GROQ_MODEL: "openai/gpt-oss-120b"
  LLM_ENCRYPTION_KEY: "REPLACE_ME-with-Fernet.generate_key()"
  GEMINI_API_KEY: "your-gemini-api-key"
  GEMINI_MODEL: "gemini-3.6-flash"
  SONARQUBE_URL: "http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000"
  SONARQUBE_TOKEN: "your_sonarqube_token"
  FRONTEND_URL: "http://METALLB_IP"
  # pydantic parses list[str] env vars as JSON — must be a JSON array
  CORS_ORIGINS: "[\"http://METALLB_IP\"]"
  API_V1_PREFIX: "/api/v1"
  BULLMQ_REVIEW_QUEUE: "review-requests"
  BULLMQ_CONCURRENCY: "5"
  # Repo-tenant service (one enabled repo = one Kubernetes namespace).
  # Best-effort calls only — selection saves never depend on it being up.
  # REPO_TENANT_INTERNAL_TOKEN must equal INTERNAL_SERVICE_TOKEN in
  # infrastructure/k8s/base/repo-tenant-service/secret.yaml.
  REPO_TENANT_SERVICE_URL: "http://repo-tenant-service.codesage.svc.cluster.local:8085"
  REPO_TENANT_INTERNAL_TOKEN: "your-repo-tenant-internal-token-hex"
