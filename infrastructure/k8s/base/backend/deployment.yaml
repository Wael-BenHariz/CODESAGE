apiVersion: apps/v1
kind: Deployment
metadata:
  name: codesage-backend
  namespace: codesage
  labels:
    app: codesage-backend
spec:
  replicas: 1
  # Single-node k3s: requests sit at ~91% of allocatable CPU, so a surge
  # pod (default rounds 25% of 1 replica up to +1) can never schedule
  # beside the old one. Terminate first, then start — brief downtime on
  # the dev node, but every release actually rolls out.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: codesage-backend
  template:
    metadata:
      labels:
        app: codesage-backend
    spec:
      containers:
        - name: backend
          image: waelbhz/codesage-api:457246251fe0705a3cc883cc7aeda1e362627d27
          # Exact tag, pre-imported at this ref (or registries.yaml entry).
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: codesage-backend-secret
            - configMapRef:
                name: semgrep-config   # SEMGREP_* client settings
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
