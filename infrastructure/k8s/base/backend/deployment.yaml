apiVersion: apps/v1
kind: Deployment
metadata:
  name: codesage-backend
  namespace: codesage
  labels:
    app: codesage-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codesage-backend
  template:
    metadata:
      labels:
        app: codesage-backend
    spec:
      containers:
        - name: backend
          image: 127.0.0.1:5000/codesage/backend:v0.3.4-invitations
          # Exact tag, pre-imported at this ref (or registries.yaml entry).
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: codesage-backend-secret
            - configMapRef:
                name: semgrep-config   # SEMGREP_* client settings
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
