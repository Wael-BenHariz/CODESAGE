apiVersion: apps/v1
kind: Deployment
metadata:
  name: codesage-frontend
  namespace: codesage
  labels:
    app: codesage-frontend
spec:
  replicas: 1
  # Single-node k3s: requests sit at ~91% of allocatable CPU, so a surge
  # pod (default rounds 25% of 1 replica up to +1) can never schedule
  # beside the old one. Terminate first, then start — brief downtime on
  # the dev node, but every release actually rolls out.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: codesage-frontend
  template:
    metadata:
      labels:
        app: codesage-frontend
    spec:
      containers:
        - name: frontend
          image: 127.0.0.1:5000/codesage/frontend:v0.4.2-workspace-rbac
          imagePullPolicy: IfNotPresent   # registries.yaml mirrors 127.0.0.1:5000
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
