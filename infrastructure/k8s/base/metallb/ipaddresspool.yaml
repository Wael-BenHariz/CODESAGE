apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: codesage-pool
  namespace: metallb-system
spec:
  addresses:
    # REPLACE with your node's LAN subnet — this node lives on 10.171.24.0/24
    - 10.171.24.200-10.171.24.210
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: codesage-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - codesage-pool
