
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: codesage-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Wael-BenHariz/CODESAGE.git
    targetRevision: main
    path: infrastructure/k8s/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

