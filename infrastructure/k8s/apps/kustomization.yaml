apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD itself must be installed separately. This root app only manages
# the namespace and child Applications, not Argo CD's own installation.
resources:
  - namespace.yaml
  - applications/codesage-app.yaml
  - applications/infrastructure-app.yaml
  - applications/data-services-app.yaml
  - applications/security-app.yaml
  - applications/monitoring-app.yaml
