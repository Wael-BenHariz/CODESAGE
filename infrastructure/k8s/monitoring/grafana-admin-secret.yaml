# Grafana admin credentials — kube-prometheus-stack/grafana picks this up via
# `grafana.admin.existingSecret` (values.yaml). Local dev cluster: admin/admin
# (same convention as faas k8s/05-monitoring). CHANGE before any shared use:
#   kubectl -n monitoring create secret generic grafana-admin-secret \
#     --from-literal=admin-user=admin --from-literal=admin-password='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
  labels:
    app: grafana
type: Opaque
stringData:
  admin-user: admin
  admin-password: "admin"
