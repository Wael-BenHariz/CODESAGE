# Authored dashboard — CodeSage mesh overview (RED metrics from the
# istio-envoy sidecar scrape, prometheus-scrape-secret.yaml job `istio-envoy`).
# Data lives in Envoy's /stats/prometheus output: istio_requests_total etc.
# with destination_namespace / destination_workload label tags.
#
# Datasource wiring: `${datasource}` template var (type datasource, query
# prometheus, current = Prometheus) → resolves to kube-prometheus-stack's
# default datasource at view time. The sidecar watches label
# grafana_dashboard=1 and writes this to /tmp/dashboards (provider `default`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-codesage-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  codesage-overview.json: |-
    {
      "annotations": { "list": [] },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 8, "showPoints": "never" }
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "sum(rate(istio_requests_total{destination_namespace=\"codesage\"}[5m])) by (destination_workload)", "legendFormat": "{{destination_workload}}", "refId": "A" }
          ],
          "title": "Request rate by workload",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 0.99 }, { "color": "green", "value": 0.999 } ] },
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never" }
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 0 },
          "id": 2,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } },
          "targets": [
            { "expr": "sum(rate(istio_requests_total{destination_namespace=\"codesage\",response_code=~\"2..\"}[5m])) / clamp_min(sum(rate(istio_requests_total{destination_namespace=\"codesage\"}[5m])), 0.0001)", "legendFormat": "2xx success rate", "refId": "A" }
          ],
          "title": "Success rate (2xx / all)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.1 } ] }
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 0 },
          "id": 3,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "sum(rate(istio_requests_total{destination_namespace=\"codesage\",response_code=~\"5..\"}[5m])) by (destination_workload)", "legendFormat": "{{destination_workload}}", "refId": "A" }
          ],
          "title": "5xx rate by workload",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "unit": "ms", "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 8, "showPoints": "never" } },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 7 },
          "id": 4,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{destination_namespace=\"codesage\"}[5m])) by (le, destination_workload))", "legendFormat": "p95 {{destination_workload}}", "refId": "A" }
          ],
          "title": "Latency p95 (ms) by workload",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 5, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0.99 } ] }
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 7 },
          "id": 5,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "sum(rate(istio_requests_total{destination_namespace=\"codesage\",response_code=~\"2..\"}[5m])) by (destination_workload) / clamp_min(sum(rate(istio_requests_total{destination_namespace=\"codesage\"}[5m])) by (destination_workload), 0.0001)", "legendFormat": "{{destination_workload}}", "refId": "A" }
          ],
          "title": "Success rate by workload",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Scrape health for every CodeSage monitoring job (1 = UP). Sources: istio-envoy sidecars, keycloak :9000, repo-tenant actuator, istiod, ingress-nginx, postgres-exporter.",
          "fieldConfig": {
            "defaults": {
              "mappings": [ { "options": { "0": { "color": "red", "text": "DOWN" }, "1": { "color": "green", "text": "UP" } }, "type": "value" } ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 7 },
          "id": 6,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "horizontal", "reduceOptions": { "calcs": [ "lastNotNull" ], "fields": "", "values": false }, "textMode": "auto", "wideLayout": true },
          "targets": [
            { "expr": "up{job=~\"istio-envoy|keycloak|repo-tenant|istiod|ingress-nginx|postgres\"}", "format": "table", "instant": true, "refId": "A" }
          ],
          "title": "Scrape targets (up)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 5, "showPoints": "never" } },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 14 },
          "id": 7,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "sum(rate(istio_requests_total{destination_namespace=\"codesage\"}[5m])) by (response_code)", "legendFormat": "{{response_code}}", "refId": "A" }
          ],
          "title": "Request rate by response code",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 5, "showPoints": "never" } },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 14 },
          "id": 8,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            { "expr": "sum(rate(istio_request_bytes_sum{destination_namespace=\"codesage\"}[5m])) by (destination_workload)", "legendFormat": "req B/s {{destination_workload}}", "refId": "C" },
            { "expr": "sum(rate(istio_response_bytes_sum{destination_namespace=\"codesage\"}[5m])) by (destination_workload)", "legendFormat": "resp B/s {{destination_workload}}", "refId": "D" }
          ],
          "title": "Throughput (req/resp bytes)",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["codesage", "istio"],
      "templating": {
        "list": [
          {
            "current": { "selected": true, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "includeAll": false,
            "label": "Datasource",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "CodeSage / Overview (Mesh RED)",
      "uid": "codesage-overview",
      "version": 1,
      "weekStart": ""
    }
