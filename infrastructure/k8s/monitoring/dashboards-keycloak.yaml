apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  keycloak-dashboard.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "datasource", "uid": "grafana" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Keycloak 24 Monitoring Dashboard - JVM, Memory, Threads, DB Pool",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "🔑 Keycloak Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red", "index": 0, "text": "DOWN" }, "1": { "color": "green", "index": 1, "text": "UP" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 1,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Keycloak Status",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "up{job=\"keycloak\"}",
              "legendFormat": "Status"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Uptime",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "process_uptime_seconds{job=\"keycloak\"}",
              "legendFormat": "Uptime"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 3,
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "CPU Usage",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "process_cpu_usage{job=\"keycloak\"}",
              "legendFormat": "CPU"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "none",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 50 }, { "color": "red", "value": 100 }] }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 4,
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Live Threads",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "jvm_threads_live_threads{job=\"keycloak\"}",
              "legendFormat": "Threads"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "none",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 8 }] }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 5,
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "DB Active Connections",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "agroal_active_count{job=\"keycloak\"}",
              "legendFormat": "Active DB Connections"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "none",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 6,
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "Loaded Classes",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "jvm_classes_loaded_classes{job=\"keycloak\"}",
              "legendFormat": "Classes"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 101,
          "title": "💾 JVM Memory",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 10,
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "JVM Memory Used",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "jvm_memory_used_bytes{job=\"keycloak\", area=\"heap\"}",
              "legendFormat": "Heap Used"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "jvm_memory_used_bytes{job=\"keycloak\", area=\"nonheap\"}",
              "legendFormat": "Non-Heap Used"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "jvm_memory_max_bytes{job=\"keycloak\", area=\"heap\"}",
              "legendFormat": "Heap Max"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 11,
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "JVM Memory Pools",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "base_memory_usedHeap_bytes{job=\"keycloak\"}",
              "legendFormat": "Used Heap"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "base_memory_committedHeap_bytes{job=\"keycloak\"}",
              "legendFormat": "Committed Heap"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "base_memory_maxHeap_bytes{job=\"keycloak\"}",
              "legendFormat": "Max Heap"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 102,
          "title": "🧵 Threads & CPU",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "none"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "id": 20,
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "JVM Threads",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "jvm_threads_live_threads{job=\"keycloak\"}",
              "legendFormat": "Live Threads"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "jvm_threads_daemon_threads{job=\"keycloak\"}",
              "legendFormat": "Daemon Threads"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "jvm_threads_peak_threads{job=\"keycloak\"}",
              "legendFormat": "Peak Threads"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "id": 21,
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "CPU Usage",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "process_cpu_usage{job=\"keycloak\"}",
              "legendFormat": "Process CPU"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "system_cpu_usage{job=\"keycloak\"}",
              "legendFormat": "System CPU"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "id": 103,
          "title": "🗄️ Database Connection Pool (Agroal)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "none"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "id": 30,
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "DB Connection Pool",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "agroal_active_count{job=\"keycloak\"}",
              "legendFormat": "Active"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "agroal_available_count{job=\"keycloak\"}",
              "legendFormat": "Available"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "agroal_awaiting_count{job=\"keycloak\"}",
              "legendFormat": "Awaiting"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "agroal_max_used_count{job=\"keycloak\"}",
              "legendFormat": "Max Used"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "ms"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "id": 31,
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "DB Connection Timing",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "agroal_blocking_time_average_milliseconds{job=\"keycloak\"}",
              "legendFormat": "Avg Blocking Time"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "agroal_blocking_time_max_milliseconds{job=\"keycloak\"}",
              "legendFormat": "Max Blocking Time"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "agroal_creation_time_average_milliseconds{job=\"keycloak\"}",
              "legendFormat": "Avg Creation Time"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 32 },
          "id": 104,
          "title": "⚙️ Worker Pool",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "none"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 33 },
          "id": 40,
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Worker Pool Activity",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "worker_pool_active{job=\"keycloak\"}",
              "legendFormat": "Active Workers"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "worker_pool_idle{job=\"keycloak\"}",
              "legendFormat": "Idle Workers"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "worker_pool_queue_size{job=\"keycloak\"}",
              "legendFormat": "Queue Size"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "ops"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 33 },
          "id": 41,
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Worker Pool Completed",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "rate(worker_pool_completed_total{job=\"keycloak\"}[5m])",
              "legendFormat": "Completed/s"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "rate(worker_pool_rejected_total{job=\"keycloak\"}[5m])",
              "legendFormat": "Rejected/s"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 41 },
          "id": 105,
          "title": "🗑️ JVM Garbage Collection",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "s"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 42 },
          "id": 50,
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "GC Pause Duration",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "rate(jvm_gc_pause_seconds_sum{job=\"keycloak\"}[5m])",
              "legendFormat": "GC Pause Rate - {{action}} {{cause}}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 42 },
          "id": 51,
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "GC Memory",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "jvm_gc_live_data_size_bytes{job=\"keycloak\"}",
              "legendFormat": "Live Data Size"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "jvm_gc_max_data_size_bytes{job=\"keycloak\"}",
              "legendFormat": "Max Data Size"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "rate(jvm_gc_memory_allocated_bytes_total{job=\"keycloak\"}[5m])",
              "legendFormat": "Allocated/s"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 50 },
          "id": 106,
          "title": "📁 System & Files",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "none"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 51 },
          "id": 60,
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Open File Descriptors",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "process_files_open_files{job=\"keycloak\"}",
              "legendFormat": "Open Files"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "process_files_max_files{job=\"keycloak\"}",
              "legendFormat": "Max Files"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 51 },
          "id": 61,
          "options": { "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "System Load",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "system_load_average_1m{job=\"keycloak\"}",
              "legendFormat": "Load Average 1m"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "system_cpu_count{job=\"keycloak\"}",
              "legendFormat": "CPU Count"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["keycloak", "jvm", "quarkus"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource",
            "label": "Datasource"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Keycloak 24 - JVM & System Metrics",
      "uid": "keycloak-jvm-quarkus",
      "version": 1
    }
