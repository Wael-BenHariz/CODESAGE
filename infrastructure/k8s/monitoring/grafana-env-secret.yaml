# Grafana sensitive env vars — mounted by `grafana.envFromSecret` (values.yaml);
# every key becomes a container env var.
#
# GF_SECURITY_SECRET_KEY: data-source/data-link encryption key (generated with
# `openssl rand -hex 32` — local dev key, rotate the same way if compromised).
# GF_SMTP_PASSWORD slot is intentionally absent (SMTP not configured yet —
# see the commented block in values.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: grafana-env-secret
  namespace: monitoring
  labels:
    app: grafana
type: Opaque
stringData:
  GF_SECURITY_SECRET_KEY: "827bc2e9444fa7146db7ee6ac69ae9eb1dd44bbc73855f7d332f8d7de708b53c"
