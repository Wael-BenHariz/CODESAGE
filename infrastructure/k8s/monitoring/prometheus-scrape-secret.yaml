# Extra scrape jobs for Prometheus — loaded via
# `prometheus.prometheusSpec.additionalScrapeConfigsSecret` (values.yaml),
# key `extra-scrape.yaml`. Pattern from faas k8s/05-monitoring.
#
# CodeSage targets the kube-prometheus-stack defaults do NOT cover
# (FastAPI backend/worker expose no /metrics — see the commented job at the
# bottom). Sidecar scrapes are needed because PeerAuthentication is
# PERMISSIVE and the monitoring namespace is NOT mesh-injected: Prometheus
# reaches every target in PLAINTEXT, which every Istio AuthorizationPolicy
# explicitly allows (actuator paths / allow-sidecar-metrics / keycloak
# allow-all).
#
# Pod-SD note: native sidecars (K8s >= 1.30 style, istio-proxy with
# restartPolicy: Always) may or may not contribute container-port metadata,
# so jobs that must hit a NON-declared port (keycloak 9000, ingress 10254)
# keep on pod LABELS and rewrite __address__ — duplicates from multi-port
# pods collapse (same final label set = same target).
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-extra-scrape
  namespace: monitoring
  labels:
    app: prometheus
type: Opaque
stringData:
  extra-scrape.yaml: |

    # ── 1. Spring Boot repo-tenant-service (micrometer /actuator/prometheus) ──
    - job_name: "repo-tenant"
      metrics_path: /actuator/prometheus
      scrape_interval: 15s
      scrape_timeout: 10s
      static_configs:
        - targets: ["repo-tenant-service.codesage.svc.cluster.local:8085"]
          labels:
            service: repo-tenant-service

    # ── 2. Keycloak 24 (KC_METRICS_ENABLED=true → micrometer feature) ───────
    #    KC 24.0.5 in this deployment serves metrics on the MAIN interface at
    #    `<http-relative-path>/metrics` = /auth/metrics (OpenMetrics text,
    #    jvm_*/process_*/vendor_* names) — NOT the KC 25+ style management
    #    port 9000 (verified: nothing listens on 9000 here).
    #    job name MUST stay `keycloak`: the Keycloak dashboard filters
    #    job="keycloak". Pod-SD + address rewrite: pod IP changes on rollout
    #    and the pod has several declared/sidecar ports — rewriting every
    #    kept target to podIP:8080 makes them collapse to one target.
    - job_name: "keycloak"
      metrics_path: /auth/metrics
      scrape_interval: 30s
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: ["codesage"]
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: keycloak
        - source_labels: [__meta_kubernetes_pod_ip]
          action: replace
          target_label: __address__
          regex: (.+)
          replacement: $1:8080
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_ip]
          action: replace
          target_label: instance

    # ── 3. Istio sidecars (envoy admin :15090 /stats/prometheus) ───────────
    #    Metric names: istio_requests_total, istio_request_duration_milliseconds
    #    buckets, envoy_* — RED data for the CodeSage overview dashboard.
    #    Allowed mesh-wide by AuthorizationPolicy allow-sidecar-metrics.
    - job_name: "istio-envoy"
      metrics_path: /stats/prometheus
      scrape_interval: 30s
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: ["codesage"]
      relabel_configs:
        # Every injected pod carries istio.io/rev (opt-out pods do not).
        - source_labels: [__meta_kubernetes_pod_annotation_istio_io_rev]
          action: keep
          regex: .+
        - source_labels: [__meta_kubernetes_pod_ip]
          action: replace
          target_label: __address__
          regex: (.+)
          replacement: $1:15090
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_label_app]
          target_label: workload

    # ── 4. istiod (:15014 http-monitoring /metrics — no sidecar, free) ──────
    - job_name: "istiod"
      scrape_interval: 30s
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: ["istio-system"]
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: istiod
        - source_labels: [__meta_kubernetes_pod_ip]
          action: replace
          target_label: __address__
          regex: (.+)
          replacement: $1:15014
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod

    # ── 5. ingress-nginx controller (:10254/metrics — not mesh-injected) ────
    - job_name: "ingress-nginx"
      scrape_interval: 30s
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: ["ingress-nginx"]
      relabel_configs:
        - source_labels:
            [__meta_kubernetes_pod_label_app_kubernetes_io_name,
             __meta_kubernetes_pod_label_app_kubernetes_io_component]
          action: keep
          regex: ingress-nginx;controller
        - source_labels: [__meta_kubernetes_pod_ip]
          action: replace
          target_label: __address__
          regex: (.+)
          replacement: $1:10254
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod

    # ── 6. postgres-exporter (Helm chart, monitoring ns, port 80 → 9187) ───
    #    Target name = release `postgres-exporter` + chart name; verify with
    #    `kubectl -n monitoring get svc` after install if it ever changes.
    - job_name: "postgres"
      scrape_interval: 30s
      static_configs:
        - targets:
            - postgres-exporter-prometheus-postgres-exporter.monitoring.svc.cluster.local:80
          labels:
            service: postgres

    # ── 7. codesage-backend (FastAPI) — NOT SCRAPEABLE YET ─────────────────
    #    The backend exposes no /metrics endpoint (known gap, docs/
    #    BACKEND_GAPS_FOR_UI.md). When prometheus-fastapi-instrumentator is
    #    added, enable the block below — NOTE: the mesh AuthorizationPolicy
    #    on codesage-backend requires a Keycloak JWT on every non-public
    #    path, so /metrics must be added to the public paths in
    #    infrastructure/k8s/istio/authorization-policy-backend.yaml at the
    #    same time, or Prometheus will get 403.
    # - job_name: "codesage-backend"
    #   metrics_path: /metrics
    #   static_configs:
    #     - targets: ["codesage-backend.codesage.svc.cluster.local:8000"]
