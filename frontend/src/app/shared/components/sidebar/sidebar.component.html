<aside id="app-sidebar" #asideEl class="sidebar" data-testid="app-sidebar" tabindex="-1">
  <a
    [routerLink]="can('write') ? '/dashboard' : '/repositories'"
    class="brand"
    data-testid="sidebar-brand"
  >
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <rect x="2" y="2" width="20" height="20" rx="5" />
        <path class="glyph" d="M7 9l3 3-3 3M12.5 15H17" />
      </svg>
    </span>
    <span class="brand-name">CodeSage</span>
  </a>

  <nav class="nav" aria-label="Main navigation">
    @if (can('write')) {
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        class="nav-item"
        data-testid="nav-dashboard"
      >
        <svg
          class="nav-icon"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          aria-hidden="true"
        >
          <rect x="2" y="2" width="5" height="5" rx="1" />
          <rect x="9" y="2" width="5" height="5" rx="1" />
          <rect x="2" y="9" width="5" height="5" rx="1" />
          <rect x="9" y="9" width="5" height="5" rx="1" />
        </svg>
        <span>Dashboard</span>
      </a>
    }

    <a
      routerLink="/repositories"
      routerLinkActive="active"
      class="nav-item"
      data-testid="nav-repositories"
    >
      <svg
        class="nav-icon"
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        aria-hidden="true"
      >
        <path
          d="M2 4.5A1.5 1.5 0 0 1 3.5 3H6l1.5 1.5H12.5A1.5 1.5 0 0 1 14 6v5.5A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5z"
        />
      </svg>
      <span>Repositories</span>
    </a>

    @if (can('write') || can('org:settings') || can('platform')) {
      <div class="nav-group">
        <span class="nav-group-label">Settings</span>

        @if (can('write')) {
          <a
            routerLink="/settings"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-item"
            data-testid="nav-settings"
          >
            <svg
              class="nav-icon"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M8 1.5l1.6 3.7 3.9.4-2.9 2.6.9 3.8L8 10.1l-3.5 1.9.9-3.8-2.9-2.6 3.9-.4z" />
            </svg>
            <span>AI model</span>
          </a>
        }

        @if (can('org:settings')) {
          <a
            routerLink="/settings/org"
            routerLinkActive="active"
            class="nav-item"
            data-testid="nav-org-settings"
          >
            <svg
              class="nav-icon"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              aria-hidden="true"
            >
              <rect x="3" y="2.5" width="10" height="11" rx="1" />
              <path d="M6 5.5h1.5M8.5 5.5H10M6 8h1.5M8.5 8H10M6 10.5h1.5M8.5 10.5H10" />
            </svg>
            <span>Organization</span>
          </a>
        }

        @if (can('platform')) {
          <a
            routerLink="/platform"
            routerLinkActive="active"
            class="nav-item"
            data-testid="nav-platform"
          >
            <svg
              class="nav-icon"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M2 4.5h12M2 8h12M2 11.5h12" />
              <circle cx="5.5" cy="4.5" r="1.6" />
              <circle cx="10.5" cy="8" r="1.6" />
              <circle cx="6.5" cy="11.5" r="1.6" />
            </svg>
            <span>Platform</span>
          </a>

          <!-- Static Platform Administration console (PFE prototype) —
               its own layout; /platform stays the read-only API view. -->
          <a
            routerLink="/platform-admin"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-item"
            data-testid="nav-platform-admin"
          >
            <svg
              class="nav-icon"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="2.5" y="2.5" width="11" height="11" rx="2" />
              <path d="M5.5 6.5h5M5.5 9.5h3" />
            </svg>
            <span>Platform Administration</span>
          </a>
        }
      </div>
    }
  </nav>
</aside>
