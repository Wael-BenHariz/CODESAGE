<div class="login">
  <div class="grid-bg"></div>

  <div class="login-card">
    <div class="login-header">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26">
          <rect x="2" y="2" width="20" height="20" rx="5" fill="currentColor" />
          <path class="glyph" d="M7 9l3 3-3 3M12.5 15H17" />
        </svg>
      </div>
      <h1 class="login-title">CodeSage</h1>
      <p class="login-subtitle">AI-powered code review for GitHub</p>
    </div>

    @if (showInstallBanner()) {
      <div class="install-banner" role="status">
        GitHub App installed successfully. Please log in to continue.
      </div>
    }

    <button class="github-btn" (click)="loginWithGitHub()">
      <svg class="github-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"
        />
      </svg>
      <span>Continue with GitHub</span>
    </button>

    <div class="login-features">
      <div class="feature">
        <span class="feature-dot"></span>
        <span>Automated code analysis</span>
      </div>
      <div class="feature">
        <span class="feature-dot"></span>
        <span>AI-powered suggestions</span>
      </div>
      <div class="feature">
        <span class="feature-dot"></span>
        <span>Secure GitHub integration</span>
      </div>
    </div>
  </div>
</div>
