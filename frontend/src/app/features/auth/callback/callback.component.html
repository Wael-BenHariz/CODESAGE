<div class="callback">
  @if (error) {
    <div class="callback-card error">
      <div class="card-icon error-icon">✗</div>
      <h2>Authentication Failed</h2>
      <p>{{ error }}</p>
      <a routerLink="/login" class="btn btn-primary">Try Again</a>
    </div>
  } @else {
    <div class="callback-card">
      <div class="spinner"></div>
      <h2>Authenticating...</h2>
      <p>Completing sign-in with GitHub</p>
    </div>
  }
</div>
