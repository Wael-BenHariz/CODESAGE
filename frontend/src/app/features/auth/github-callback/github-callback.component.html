<div class="github-callback">
  <div class="callback-card">
    @if (state() === 'processing') {
      <app-spinner label="Finishing GitHub setup…" />
    }
    <h1 class="status" [class.error]="!isSuccess()">{{ statusMessage() }}</h1>

    @if (state() === 'error') {
      <button class="retry-btn" (click)="retry()">Try again</button>
    } @else if (state() === 'success') {
      <a routerLink="/login" [queryParams]="{ message: 'app_installed' }" class="continue-link">
        Log in to continue →
      </a>
    } @else {
      <a routerLink="/dashboard" class="continue-link">Continue to dashboard →</a>
    }
  </div>
</div>
