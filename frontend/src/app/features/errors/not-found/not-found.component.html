<main class="error-page" data-testid="not-found-page">
  <p class="error-code">404</p>
  <h1>Page not found</h1>
  <p class="error-copy">
    The page you're looking for doesn't exist — it may have been moved, removed, or the link is out
    of date.
  </p>
  <div class="error-actions">
    <a routerLink="/repositories" class="btn btn-primary">Go to repositories</a>
    <a routerLink="/" class="btn btn-ghost">Home</a>
  </div>
</main>
