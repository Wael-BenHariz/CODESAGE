<div class="pa-page" data-testid="pa-settings">
  <header class="pa-page-header">
    <div>
      <h1 class="pa-page-title">Platform Global Settings</h1>
      <p class="pa-page-subtitle">
        Configure general, AI and security settings. — static prototype: nothing is saved
        server-side.
      </p>
    </div>
  </header>

  <section class="pa-panel" aria-labelledby="pa-general-title">
    <div class="pa-panel-head">
      <h2 class="pa-panel-title" id="pa-general-title">General settings</h2>
    </div>
    <div class="pa-form">
      <div class="pa-form-grid">
        <label class="pa-form-row">
          <span class="pa-field-label">Platform name</span>
          <input
            type="text"
            class="input"
            [ngModel]="general().platformName"
            (ngModelChange)="setGeneral('platformName', $event)"
            data-testid="pa-settings-platform-name"
          />
        </label>
        <label class="pa-form-row">
          <span class="pa-field-label">Application URL</span>
          <input
            type="url"
            class="input"
            [ngModel]="general().appUrl"
            (ngModelChange)="setGeneral('appUrl', $event)"
            data-testid="pa-settings-app-url"
          />
        </label>
        <label class="pa-form-row">
          <span class="pa-field-label">Default language</span>
          <select
            class="input"
            [ngModel]="general().defaultLanguage"
            (ngModelChange)="setGeneral('defaultLanguage', $event)"
            data-testid="pa-settings-language"
          >
            @for (language of languages; track language) {
              <option [value]="language">{{ language }}</option>
            }
          </select>
        </label>
        <div class="pa-form-row">
          <span class="pa-field-label">Maintenance mode</span>
          <button
            type="button"
            class="pa-toggle"
            [class.on]="general().maintenanceMode"
            role="switch"
            [attr.aria-checked]="general().maintenanceMode"
            (click)="toggleGeneral('maintenanceMode')"
            data-testid="pa-settings-maintenance"
          >
            <span class="pa-toggle-track" aria-hidden="true">
              <span class="pa-toggle-thumb"></span>
            </span>
            <span>{{ general().maintenanceMode ? 'ON' : 'OFF' }}</span>
          </button>
        </div>
      </div>
      <div>
        <button
          type="button"
          class="btn btn-primary"
          (click)="saveGeneral()"
          data-testid="pa-settings-save-general"
        >
          Save
        </button>
      </div>
    </div>
  </section>

  <section class="pa-panel" aria-labelledby="pa-ai-title">
    <div class="pa-panel-head">
      <h2 class="pa-panel-title" id="pa-ai-title">AI settings</h2>
      <span class="pa-panel-meta">Demo values — no provider contacted</span>
    </div>
    <div class="pa-form">
      <div class="pa-form-grid">
        <label class="pa-form-row">
          <span class="pa-field-label">Default provider</span>
          <select
            class="input"
            [ngModel]="ai().provider"
            (ngModelChange)="setAi('provider', $event)"
            data-testid="pa-settings-provider"
          >
            @for (provider of providers; track provider) {
              <option [value]="provider">{{ provider }}</option>
            }
          </select>
        </label>
        <label class="pa-form-row">
          <span class="pa-field-label">Default model</span>
          <select
            class="input"
            [ngModel]="ai().model"
            (ngModelChange)="setAi('model', $event)"
            data-testid="pa-settings-model"
          >
            @for (model of models; track model) {
              <option [value]="model">{{ model }}</option>
            }
          </select>
        </label>
        <label class="pa-form-row">
          <span class="pa-field-label">Max concurrent requests</span>
          <input
            type="number"
            min="1"
            class="input"
            [ngModel]="ai().maxConcurrentRequests"
            (ngModelChange)="setAiNumber('maxConcurrentRequests', $event)"
            data-testid="pa-settings-concurrency"
          />
        </label>
        <label class="pa-form-row">
          <span class="pa-field-label">Review timeout</span>
          <span class="pa-input-suffix">
            <input
              type="number"
              min="1"
              class="input"
              [ngModel]="ai().reviewTimeoutSeconds"
              (ngModelChange)="setAiNumber('reviewTimeoutSeconds', $event)"
              data-testid="pa-settings-timeout"
            />
            <span class="pa-suffix">seconds</span>
          </span>
        </label>
      </div>
      <div>
        <button
          type="button"
          class="btn btn-primary"
          (click)="saveAi()"
          data-testid="pa-settings-save-ai"
        >
          Save
        </button>
      </div>
    </div>
  </section>

  <section class="pa-panel" aria-labelledby="pa-security-title">
    <div class="pa-panel-head">
      <h2 class="pa-panel-title" id="pa-security-title">Security</h2>
    </div>
    <div class="pa-form">
      <div class="pa-form-grid">
        <label class="pa-form-row">
          <span class="pa-field-label">Max session duration</span>
          <span class="pa-input-suffix">
            <input
              type="number"
              min="1"
              class="input"
              [ngModel]="security().sessionDurationMinutes"
              (ngModelChange)="setSecurityNumber('sessionDurationMinutes', $event)"
              data-testid="pa-settings-session"
            />
            <span class="pa-suffix">minutes</span>
          </span>
        </label>
        <label class="pa-form-row">
          <span class="pa-field-label">Max login attempts</span>
          <input
            type="number"
            min="1"
            class="input"
            [ngModel]="security().maxLoginAttempts"
            (ngModelChange)="setSecurityNumber('maxLoginAttempts', $event)"
            data-testid="pa-settings-attempts"
          />
        </label>
        <label class="pa-form-row">
          <span class="pa-field-label">Invitation expiry</span>
          <span class="pa-input-suffix">
            <input
              type="number"
              min="1"
              class="input"
              [ngModel]="security().invitationExpiryDays"
              (ngModelChange)="setSecurityNumber('invitationExpiryDays', $event)"
              data-testid="pa-settings-invitation"
            />
            <span class="pa-suffix">days</span>
          </span>
        </label>
        <div class="pa-form-row">
          <span class="pa-field-label">Enforced authentication</span>
          <button
            type="button"
            class="pa-toggle"
            [class.on]="security().enforcedAuth"
            role="switch"
            [attr.aria-checked]="security().enforcedAuth"
            (click)="toggleSecurity('enforcedAuth')"
            data-testid="pa-settings-mfa"
          >
            <span class="pa-toggle-track" aria-hidden="true">
              <span class="pa-toggle-thumb"></span>
            </span>
            <span>{{ security().enforcedAuth ? 'ON' : 'OFF' }}</span>
          </button>
        </div>
      </div>
      <div>
        <button
          type="button"
          class="btn btn-primary"
          (click)="saveSecurity()"
          data-testid="pa-settings-save-security"
        >
          Save
        </button>
      </div>
    </div>
  </section>
</div>
