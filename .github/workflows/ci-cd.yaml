# ============================================
# CodeSage CI/CD Pipeline - GitHub Actions
# ============================================

name: CodeSage CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  DOCKER_BUILDX_VERSION: '0.12.0'

jobs:
  # ============================================
  # Code Quality & Linting
  # ============================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # Frontend Quality Checks
      - name: Frontend - Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend - Check ESLint
        run: npm run lint
        working-directory: frontend

      - name: Frontend - Check TypeScript
        run: npm run type-check
        working-directory: frontend

      - name: Frontend - Check Prettier
        run: npm run format:check
        working-directory: frontend

      # Backend Quality Checks
      - name: Backend - Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy bandit safety
        working-directory: backend

      - name: Backend - Check Ruff (Linter)
        run: ruff check .
        working-directory: backend

      - name: Backend - Check Black (Formatter)
        run: black --check .
        working-directory: backend

      - name: Backend - Check MyPy (Type checker)
        run: mypy .
        working-directory: backend

      - name: Backend - Check Bandit (Security)
        run: bandit -r .
        working-directory: backend

  # ============================================
  # Security Scanning
  # ============================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: code-quality
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Dependency Vulnerability Scanning
      - name: Frontend - Audit NPM dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Backend - Audit Python dependencies
        run: |
          pip install safety
          safety check --full-report
        working-directory: backend

      # Container Security Scanning
      - name: Build container for security scan
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      # SAST
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >
            p/owasp-top-ten
            p/nodejs
            p/python-best-practices
            p/flask

  # ============================================
  # Unit & Integration Tests
  # ============================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: codesage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Backend - Install dependencies
        run: |
          python -m pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock httpx
        working-directory: backend

      - name: Backend - Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/codesage_test
          REDIS_URL: redis://localhost:6379/0
          GITHUB_CLIENT_ID: test
          GITHUB_CLIENT_SECRET: test
          JWT_SECRET: test-secret
        run: |
          pytest tests/ \
            --cov=codesage \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            -v \
            -x
        working-directory: backend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend - Run tests
        run: npm run test:ci
        working-directory: frontend
  # ============================================
  # SonarQube Cloud Analysis
  # ============================================
  sonarqube:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    needs: [code-quality, test]

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  # ============================================
  # Build Docker Images
  # ============================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [security-scan, test,sonarqube]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, api, worker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service == 'api' && 'backend' || matrix.service }}
          file: ./${{ matrix.service == 'api' && 'backend' || matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=${{ github.ref_name }}

  # ============================================
  # Deploy to Development
  # ============================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment:
      name: development
      url: https://dev.codesage.dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to EKS
        uses: azure/k8s-deploy@v4
        with:
          namespace: codesage-dev
          manifests: |
            infrastructure/kubernetes/apps/frontend/deployment.yaml
            infrastructure/kubernetes/apps/api/deployment.yaml
            infrastructure/kubernetes/apps/worker/deployment.yaml
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:${{ github.sha }}
          strategy: rolling

      - name: Run smoke tests
        run: |
          sleep 30
          curl -f https://dev.codesage.dev/api/health || exit 1

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Deployment to Development failed!",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*CodeSage Dev Deployment Failed*\n• Commit: `${{ github.sha }}`\n• Branch: `${{ github.ref_name }}`\n• Author: ${{ github.actor }}"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ============================================
  # Deploy to Staging
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: https://staging.codesage.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update image tags
        run: |
          find infrastructure/kubernetes -name 'kustomization.yaml' -exec sed -i \
            -e "s|frontend:.*|frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}|" \
            -e "s|api:.*|api: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}|" \
            -e "s|worker:.*|worker: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:${{ github.sha }}|" {} \;

      - name: Deploy to Staging
        uses: azure/k8s-deploy@v4
        with:
          namespace: codesage-staging
          manifests: |
            infrastructure/kubernetes/apps
          action: deploy

      - name: Run integration tests
        run: |
          npm run test:e2e -- --env=staging
        working-directory: frontend

      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Successfully deployed to Staging!",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*CodeSage Staging Deployed*\n• Commit: `${{ github.sha }}`\n• URL: https://staging.codesage.io"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ============================================
  # Blue-Green Deploy to Production
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://codesage.io
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy Green Environment
        run: |
          kubectl set image deployment/codesage-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }} \
            -n codesage-green
            
          kubectl set image deployment/codesage-worker \
            worker=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:${{ github.sha }} \
            -n codesage-green
            
          kubectl set image deployment/codesage-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }} \
            -n codesage-green

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/codesage-api -n codesage-green --timeout=600s
          kubectl rollout status deployment/codesage-worker -n codesage-green --timeout=600s
          kubectl rollout status deployment/codesage-frontend -n codesage-green --timeout=600s

      - name: Run smoke tests on Green
        run: |
          GREEN_LB=$(kubectl get svc codesage-frontend -n codesage-green -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -f "https://$GREEN_LB/api/health" || exit 1

      - name: Switch traffic (Blue to Green)
        run: |
          kubectl patch service codesage-frontend -n codesage \
            -p '{"spec":{"selector":{"slot":"green"}}}'
            
          kubectl patch service codesage-api -n codesage \
            -p '{"spec":{"selector":{"slot":"green"}}}'

      - name: Verify production health
        run: |
          sleep 30
          curl -f https://codesage.io/api/health || exit 1

      - name: Create GitHub Release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            ## What's Changed
            - Commit: `${{ github.sha }}`
            - Deployed by GitHub Actions
          draft: false
          prerelease: false

      - name: Notify success
        uses: slackapi/slack-github-action@v1
        if: success()
        with:
          payload: |
            {
              "text": "Production deployment successful!",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*CodeSage Production Deployed*\n• Version: `${{ github.run_number }}`\n• Commit: `${{ github.sha }}`\n• URL: https://codesage.io"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl patch service codesage-frontend -n codesage \
            -p '{"spec":{"selector":{"slot":"blue"}}}'
          kubectl patch service codesage-api -n codesage \
            -p '{"spec":{"selector":{"slot":"blue"}}}'
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

  # ============================================
  # Post-Deploy Monitoring
  # ============================================
  monitor-deployment:
    name: Post-Deploy Monitoring
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()
    steps:
      - name: Check deployment health
        run: |
          echo "Checking deployment metrics..."
          
          # Check error rate
          ERROR_RATE=$(curl -s https://codesage.io/api/metrics | jq '.error_rate')
          if (( $(echo "$ERROR_RATE > 0.05" | bc -l) )); then
            echo "Warning: Error rate is above threshold"
            exit 1
          fi
          
          echo "Deployment health check passed"

      - name: Generate deployment report
        if: always()
        run: |
          echo "## Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "### Build: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.deploy-production.result }}" >> $GITHUB_STEP_SUMMARY
